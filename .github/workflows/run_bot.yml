name: OTP Wave 24/7 Always-Online Bot Runner

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      custom_base_url:
        description: 'Thirdwave API Base URL (leave empty to use THIRDWAVE_BASE_URL secret or default)'
        required: false
        default: ''
      is_handover:
        description: 'Internal zero-restart handover flag (true/false)'
        required: false
        default: 'false'
      is_manual_restart:
        description: 'Manual admin restart flag (true/false)'
        required: false
        default: 'false'
  schedule:
    # Backup safety net — fires every 30m ONLY if bot ever stops
    - cron: '*/30 * * * *'

# Only ONE bot instance ever runs at a time — guaranteed by shared concurrency group.
# Push/dispatch/handover: cancel-in-progress=true  → instantly kills old bot, starts new one (zero delay).
# Schedule safety-net:    cancel-in-progress=false → queues behind running bot, starts only if bot is dead.
# This prevents TWO bots ever running simultaneously (which caused Telegram polling conflicts & crashes).
concurrency:
  group: otp-wave-bot-single-instance
  cancel-in-progress: ${{ github.event_name != 'schedule' }}

permissions:
  actions: write
  contents: read

jobs:
  run-bot:
    name: Run OTP WAVE 24/7
    runs-on: ubuntu-latest
    # GitHub hard limit is 6h (360 min). We use 358 to leave a 2-min safety buffer.
    timeout-minutes: 358

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Scheduled Safety-Net Check
        if: github.event_name == 'schedule'
        run: |
          # The shared concurrency group already guarantees only one bot runs at a time.
          # If this scheduled run reached here, it means the bot was NOT running (it won the
          # concurrency queue lock). So we always proceed to start the bot as a recovery.
          echo "⚠️ Scheduled safety-net fired — bot was not running. Starting recovery session now."

      # ─────────────────────────────────────────────────────────────────
      # 1. Cancel any previous running instance FIRST and wait for it to
      #    finish saving its latest cache BEFORE we restore the cache!
      # ─────────────────────────────────────────────────────────────────
      - name: Cancel Any Other Running Instances
        if: github.event_name != 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
          PAT: ${{ secrets.PAT }}
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
        run: |
          python3 << 'PYEOF'
          import os, json, time, urllib.request
          token = os.environ.get('GH_TOKEN', '')
          repo = '${{ github.repository }}'
          current_id = '${{ github.run_id }}'
          if not token:
              print('⚠️ No token available, skipping cancel.')
              exit(0)
          headers = {'Authorization': f'Bearer {token}', 'Accept': 'application/vnd.github+json', 'User-Agent': 'BotRunner'}
          try:
              req = urllib.request.Request(f'https://api.github.com/repos/{repo}/actions/runs?per_page=30', headers=headers)
              with urllib.request.urlopen(req, timeout=8) as resp:
                  data = json.load(resp)
              cancelled_ids = []
              for r in data.get('workflow_runs', []):
                  r_id = str(r.get('id'))
                  r_num = r.get('run_number')
                  r_status = r.get('status')
                  if r_id != current_id and r_status in ('in_progress', 'queued', 'pending', 'waiting'):
                      try:
                          c_req = urllib.request.Request(
                              f'https://api.github.com/repos/{repo}/actions/runs/{r_id}/cancel',
                              method='POST', headers=headers
                          )
                          urllib.request.urlopen(c_req, timeout=8)
                          print(f'🛑 Cancelled run #{r_num} (id:{r_id}, was:{r_status})')
                          cancelled_ids.append(r_id)
                      except Exception as e:
                          print(f'⚠️ Could not cancel run #{r_num}: {e}')
              if cancelled_ids:
                  print(f'⏳ Waiting for {len(cancelled_ids)} previous runner(s) to finish saving cache...')
                  for _ in range(15):
                      time.sleep(2)
                      still_active = 0
                      for cid in cancelled_ids:
                          try:
                              chk_req = urllib.request.Request(f'https://api.github.com/repos/{repo}/actions/runs/{cid}', headers=headers)
                              with urllib.request.urlopen(chk_req, timeout=5) as cr:
                                  cdata = json.load(cr)
                                  if cdata.get('status') != 'completed':
                                      still_active += 1
                          except Exception:
                              pass
                      if still_active == 0:
                          print('✅ Previous runner(s) completed and saved cache.')
                          break
              else:
                  print('✅ No other active runners found.')
          except Exception as e:
              print(f'⚠️ Cancel check error: {e}')
          PYEOF
          echo "✅ Cancel step complete."

      # ─────────────────────────────────────────────────────────────────
      # 2. Restore the OTP database & settings from cache AFTER any
      #    previous runner has finished saving its latest cache!
      # ─────────────────────────────────────────────────────────────────
      - name: Restore Persistent Database from Cache
        uses: actions/cache/restore@v4
        with:
          path: |
            bot1_database.db
            bot1_database.db-wal
            bot1_database.db-shm
            bot_data.json
          key: bot1-database-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            bot1-database-

      - name: Clear Old Completed Workflow History
        env:
          GH_TOKEN: ${{ github.token }}
          PAT: ${{ secrets.PAT }}
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
        run: |
          python3 << 'PYEOF'
          import os, sys, json, urllib.request
          from concurrent.futures import ThreadPoolExecutor
          repo = '${{ github.repository }}'
          current_run_id = '${{ github.run_id }}'
          tokens = [t.strip() for t in [
              os.environ.get('PAT', ''),
              os.environ.get('GH_TOKEN', ''),
              os.environ.get('GIST_TOKEN', ''),
          ] if t.strip() and t.strip().lower() != 'true']
          if not tokens:
              print('⚠️ No token available, skipping history cleanup.')
              sys.exit(0)
          runs = []
          for tok in tokens:
              try:
                  req = urllib.request.Request(
                      f'https://api.github.com/repos/{repo}/actions/runs?per_page=30',
                      headers={'Authorization': f'Bearer {tok}', 'Accept': 'application/vnd.github+json', 'User-Agent': 'Cleaner'}
                  )
                  with urllib.request.urlopen(req, timeout=8) as resp:
                      data = json.load(resp)
                  runs = [r for r in data.get('workflow_runs', []) if str(r.get('id')) != current_run_id and r.get('status') == 'completed']
                  if runs or True:
                      break
              except Exception as e:
                  print(f'List error: {e}')
                  continue
          if not runs:
              print('✅ No old completed runs to clean.')
              sys.exit(0)
          print(f'🧹 Purging {len(runs)} old run(s) in parallel...')
          def delete_run(r):
              r_id = str(r.get('id'))
              r_num = r.get('run_number')
              for tok in tokens:
                  try:
                      del_req = urllib.request.Request(
                          f'https://api.github.com/repos/{repo}/actions/runs/{r_id}',
                          method='DELETE',
                          headers={'Authorization': f'Bearer {tok}', 'Accept': 'application/vnd.github+json', 'User-Agent': 'Cleaner'}
                      )
                      with urllib.request.urlopen(del_req, timeout=8) as dr:
                          if dr.status in (200, 204):
                              print(f'  🗑️ Purged run #{r_num} (id:{r_id})')
                              return
                  except Exception:
                      continue
          with ThreadPoolExecutor(max_workers=8) as pool:
              list(pool.map(delete_run, runs))
          print('✅ History cleaned.')
          PYEOF

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          pip install --quiet "python-telegram-bot>=21.0" "httpx>=0.27.0" "python-dotenv>=1.0.0"
          echo "✅ Dependencies ready."

      - name: Validate Required Secrets & Config
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          THIRDWAVE_API_KEY: ${{ secrets.THIRDWAVE_API_KEY }}
          TELEGRAM_GROUP_CHAT_ID: ${{ secrets.TELEGRAM_GROUP_CHAT_ID }}
          THIRDWAVE_BASE_URL: ${{ github.event.inputs.custom_base_url || secrets.THIRDWAVE_BASE_URL || 'https://thirdwave.im' }}
        run: |
          echo "🔍 Checking required GitHub Secrets & Config..."
          MISSING=""
          [ -z "$TELEGRAM_BOT_TOKEN" ]     && MISSING="${MISSING}\n  - TELEGRAM_BOT_TOKEN"
          [ -z "$THIRDWAVE_API_KEY" ]      && MISSING="${MISSING}\n  - THIRDWAVE_API_KEY"
          [ -z "$TELEGRAM_GROUP_CHAT_ID" ] && MISSING="${MISSING}\n  - TELEGRAM_GROUP_CHAT_ID"
          if [ -n "$MISSING" ]; then
            echo -e "❌ Missing secrets:${MISSING}"
            exit 1
          fi

          echo "🔍 Validating Telegram Bot Token with Telegram API..."
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/getMe")
          if [ "$HTTP_CODE" = "401" ]; then
            echo "=========================================================================="
            echo "❌ CRITICAL ERROR: TELEGRAM_BOT_TOKEN is INVALID or REVOKED (HTTP 401)!"
            echo "👉 The token stored in GitHub Secrets was revoked or reset on @BotFather."
            echo "👉 Solution: Open @BotFather in Telegram, copy your new token (or generate one with /token),"
            echo "   then go to GitHub -> Settings -> Secrets and variables -> Actions"
            echo "   and update TELEGRAM_BOT_TOKEN with your new bot token."
            echo "=========================================================================="
            exit 1
          fi
          echo "✅ Telegram Bot Token verified successfully (HTTP $HTTP_CODE)."
          echo "✅ All required secrets present!"
          echo "🌐 Active API Base URL: $THIRDWAVE_BASE_URL"
          if [ -n "${{ secrets.THIRDWAVE_BASE_URL }}" ]; then
            echo "   (Overridden by GitHub Secret: THIRDWAVE_BASE_URL)"
          fi
          if [ -f "bot1_database.db" ]; then
            echo "✅ Bot 1 database restored from cache — no re-sends will occur."
          else
            echo "ℹ️ Fresh database (first run or cache expired)."
          fi

      - name: Run Bot (Auto-Recovery & Crash Protection)
        id: run_bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          THIRDWAVE_API_KEY: ${{ secrets.THIRDWAVE_API_KEY }}
          THIRDWAVE_BASE_URL: ${{ github.event.inputs.custom_base_url || secrets.THIRDWAVE_BASE_URL || 'https://thirdwave.im' }}
          TELEGRAM_GROUP_CHAT_ID: ${{ secrets.TELEGRAM_GROUP_CHAT_ID }}
          SECONDARY_GROUP_CHAT_ID: ${{ secrets.SECONDARY_GROUP_CHAT_ID }}
          POLL_INTERVAL_SECONDS: ${{ secrets.POLL_INTERVAL_SECONDS || '7.5' }}
          ADMIN_USER_IDS: ${{ secrets.ADMIN_USER_IDS }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          GIST_TOKEN: ${{ secrets.GIST_TOKEN || secrets.PAT || secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}
          PAT: ${{ secrets.PAT || '' }}
          GIST_ID: ${{ secrets.GIST_ID }}
          STARTUP_TYPE: ${{ github.event_name }}
          GITHUB_SHA: ${{ github.sha }}
          IS_HANDOVER: ${{ github.event.inputs.is_handover || 'false' }}
          IS_MANUAL_RESTART: ${{ github.event.inputs.is_manual_restart || 'false' }}
          DB_FILE: ${{ github.workspace }}/bot1_database.db
          SESSION_TIMEOUT: "19500"
          PYTHONUNBUFFERED: "1"
          PYTHONIOENCODING: "utf-8"
        run: |
          echo "========================================"
          echo "  OTP WAVE — Starting Up (24/7)"
          echo "  Trigger  : ${{ github.event_name }}"
          echo "  API Base : $THIRDWAVE_BASE_URL"
          echo "  DB Path  : $DB_FILE"
          echo "  Session  : 5h 25min (19500s) — GitHub limit: 6h"
          echo "========================================"

          # Continuous background cleaner: deletes completed runs in parallel every 180s
          (
            while true; do
              sleep 180
              python3 -c "
              import os, json, urllib.request
              from concurrent.futures import ThreadPoolExecutor
              repo = '${{ github.repository }}'
              current_id = '${{ github.run_id }}'
              tokens = [os.getenv('PAT', '').strip(), os.getenv('GH_TOKEN', '').strip(), os.getenv('GIST_TOKEN', '').strip(), os.getenv('GITHUB_TOKEN', '').strip()]
              tokens = [t for t in tokens if t and t.lower() != 'true']
              for tok in tokens:
                  try:
                      req = urllib.request.Request(f'https://api.github.com/repos/{repo}/actions/runs?per_page=30', headers={'Authorization': f'Bearer {tok}', 'Accept': 'application/vnd.github+json', 'User-Agent': 'Cleaner'})
                      with urllib.request.urlopen(req, timeout=4) as resp:
                          runs = [r for r in json.load(resp).get('workflow_runs', []) if str(r.get('id')) != current_id and r.get('status') == 'completed']
                          if runs:
                              def del_r(r):
                                  for t in tokens:
                                      try:
                                          d_req = urllib.request.Request(f'https://api.github.com/repos/{repo}/actions/runs/{r[\"id\"]}', method='DELETE', headers={'Authorization': f'Bearer {t}', 'Accept': 'application/vnd.github+json', 'User-Agent': 'Cleaner'})
                                          with urllib.request.urlopen(d_req, timeout=4) as dr:
                                              if dr.status in (200, 204): return
                                      except Exception: pass
                              with ThreadPoolExecutor(max_workers=8) as p: list(p.map(del_r, runs))
                              break
                  except Exception: pass
              " 2>/dev/null || true
            done
          ) &

          # 19500s = 5h 25min. Leaves ~33 min for setup + cache save + self-trigger
          END_TIME=$((SECONDS + 19500))

          # Instantly exit when GitHub sends cancellation signals (SIGTERM/SIGINT)
          trap "echo '🛑 Immediate cancellation signal received. Halting runner.'; exit 0" SIGTERM SIGINT

          # Prevent set -e from killing the runner loop on transient bot crashes
          set +e

          while true; do
            REMAINING=$((END_TIME - SECONDS))

            if [ $REMAINING -lt 90 ]; then
              echo "⏱️ Session window ending. Exiting cleanly for save & self-trigger."
              break
            fi

            echo "⚡ [$(date -u +'%Y-%m-%d %H:%M:%S UTC')] Starting bot.py... (${REMAINING}s remaining)"
            python bot.py
            EXIT_CODE=$?

            if [ $EXIT_CODE -eq 1 ]; then
              echo "❌ Config error. Halting."
              exit 1
            fi

            if [ $EXIT_CODE -eq 0 ]; then
              echo "✅ Clean session handover (exit 0). Handing off to next workflow runner session..."
              break
            fi

            # Exit > 128 = killed by GitHub Actions cancel-in-progress (SIGINT=130, SIGTERM=143)
            # Must exit immediately so the newly pushed workflow run starts with ZERO delay!
            if [ $EXIT_CODE -gt 128 ]; then
              echo "🛑 Process terminated by GitHub cancellation ($EXIT_CODE). Exiting loop immediately."
              break
            fi

            echo "⚠️ [$(date -u +'%Y-%m-%d %H:%M:%S UTC')] Bot stopped (exit: $EXIT_CODE). Restarting in 3s..."
            sleep 3
          done

          echo "⏱️ Session complete. Saving database and triggering new runner session..."

      # ─────────────────────────────────────────────────────────────────
      # Save the OTP database BEFORE runner is destroyed so next run restores it
      # ─────────────────────────────────────────────────────────────────
      - name: Pre-Save Database Checkpoint
        if: always()
        run: |
          python3 -c "
          import sqlite3, os
          if os.path.exists('bot1_database.db'):
              try:
                  conn = sqlite3.connect('bot1_database.db', timeout=10.0)
                  conn.execute('PRAGMA wal_checkpoint(TRUNCATE);')
                  conn.commit()
                  conn.close()
                  print('✅ SQLite WAL checkpoint completed cleanly before cache save.')
              except Exception as e:
                  print(f'⚠️ WAL checkpoint notice: {e}')
          "

      - name: Save OTP Database to Cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            bot1_database.db
            bot1_database.db-wal
            bot1_database.db-shm
            bot_data.json
          key: bot1-database-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Self-Trigger Next Run (Zero Downtime Restart)
        if: ${{ !cancelled() }}
        env:
          PAT_TOKEN: ${{ secrets.PAT || secrets.WORKFLOW_TOKEN || secrets.GH_PAT }}
          GH_TOKEN: ${{ github.token }}
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
        run: |
          if [ -f ".handover_dispatched" ]; then
            echo "✅ Proactive handover was already dispatched in advance by bot.py. Skipping duplicate trigger."
            exit 0
          fi

          IS_MANUAL="false"
          if [ -f ".manual_restart" ]; then
            IS_MANUAL="true"
          fi

          DISPATCH_BODY="{\"ref\":\"main\",\"inputs\":{\"is_handover\":\"true\",\"is_manual_restart\":\"$IS_MANUAL\"}}"
          URL="https://api.github.com/repos/${{ github.repository }}/actions/workflows/run_bot.yml/dispatches"

          echo "🔄 Triggering next session immediately (is_manual_restart=$IS_MANUAL)..."
          TRIGGERED="false"

          # 1. Try Personal Access Token (PAT) first — required for workflow dispatch permissions
          if [ -n "$PAT_TOKEN" ]; then
            echo "🔑 Attempting dispatch with PAT..."
            HTTP_CODE=$(curl -s -o /tmp/dispatch_out.txt -w "%{http_code}" -X POST \
              -H "Authorization: Bearer $PAT_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "$URL" -d "$DISPATCH_BODY")
            if [ "$HTTP_CODE" = "204" ] || [ "$HTTP_CODE" = "200" ] || [ "$HTTP_CODE" = "201" ]; then
              TRIGGERED="true"
            else
              echo "ℹ️ PAT dispatch returned HTTP $HTTP_CODE: $(cat /tmp/dispatch_out.txt 2>/dev/null)"
            fi
          fi

          # 2. Try GITHUB_TOKEN if PAT wasn't provided or failed
          if [ "$TRIGGERED" != "true" ] && [ -n "$GH_TOKEN" ]; then
            echo "🔑 Attempting dispatch with GH_TOKEN..."
            HTTP_CODE=$(curl -s -o /tmp/dispatch_out.txt -w "%{http_code}" -X POST \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "$URL" -d "$DISPATCH_BODY")
            if [ "$HTTP_CODE" = "204" ] || [ "$HTTP_CODE" = "200" ] || [ "$HTTP_CODE" = "201" ]; then
              TRIGGERED="true"
            else
              echo "ℹ️ GH_TOKEN dispatch returned HTTP $HTTP_CODE"
            fi
          fi

          # 3. Try GIST_TOKEN fallback
          if [ "$TRIGGERED" != "true" ] && [ -n "$GIST_TOKEN" ]; then
            echo "🔑 Attempting dispatch with GIST_TOKEN..."
            HTTP_CODE=$(curl -s -o /tmp/dispatch_out.txt -w "%{http_code}" -X POST \
              -H "Authorization: Bearer $GIST_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "$URL" -d "$DISPATCH_BODY")
            if [ "$HTTP_CODE" = "204" ] || [ "$HTTP_CODE" = "200" ] || [ "$HTTP_CODE" = "201" ]; then
              TRIGGERED="true"
            else
              echo "ℹ️ GIST_TOKEN dispatch returned HTTP $HTTP_CODE"
            fi
          fi

          if [ "$TRIGGERED" = "true" ]; then
            echo "✅ Next run triggered! Bot continues with new server session."
          else
            echo "⚠️ Direct self-trigger did not succeed (HTTP $HTTP_CODE). Safety-net cron (every 30m) will catch and resume this run automatically."
            echo "💡 Tip: Add a GitHub Secret named PAT with 'workflow' / 'repo' scope for instant 0s handover."
          fi
